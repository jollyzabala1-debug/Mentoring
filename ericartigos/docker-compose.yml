version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ericartigos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ericartigos
      MYSQL_USER: ericartigos
      MYSQL_PASSWORD: ericartigos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ericartigos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  ericartigos:
    driver: bridge
